<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/loginContas.css') }}">
    <title>Document</title>

</head>
<body>
    <div id="pag">
        <form action="/logarInstagram" method="post">
            <div id="Instagram">
                <input type="text" name="InstagramUsername" id="InstagramUsername" placeholder="Insira seu usuário do Instagram">
                <input type="text" name="InstagramPassword" id="InstagramPassword" placeholder="Insira sua senha">
                <button type="button" onclick="logarInstagram()">confirmar</button>
            </div>
        </form>
        <form action="/logarFacebook" method="post">
            <div id="Instagram">
                <input type="text" name="FacebookUsername" id="FacebookUsername" placeholder="Insira seu usuário do Facebook">
                <input type="text" name="FacebookPassword" id="FacebookPassword" placeholder="Insira sua senha">
                <button type="button" onclick="logarFacebook()">confirmar</button>
            </div>
        </form>
        <form action="/logarLinkedIn" method="post">
            <div id="Instagram">
                <input type="text" name="LinkedInUsername" id="LinkedInUsername" placeholder="Insira seu usuário do LinkedIn">
                <input type="text" name="LinkedInPassword" id="LinkedInPassword" placeholder="Insira sua senha">
                <button type="button" onclick="logarLinkedIn()">confirmar</button>
            </div>
        </form>
    </div>
</body>
</html>
